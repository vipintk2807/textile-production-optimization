[project]
name = "textile-production-optimization"
version = "0.1.0"
description = "Constraint-based textile production scheduling (OR-Tools CP-SAT, Streamlit, SQLite)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "performance: synthetic solver benchmarks (slower; run with -m performance)",
]
addopts = "-m 'not performance'"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # line length is handled by `ruff format`
